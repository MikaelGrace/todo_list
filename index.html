<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="todo-header">
            <h2>ToDo List</h2>
            <img src="images/Paper-Write--Streamline-Ultimate.png" height="50px" />
        </div>

        <div class="todo-body">
            <input
                type="text"
                id="todoText"
                class="todo-input"
                placeholder="Add your items"
            />
            <img
                src="images/Plus-Math-Symbol-Circle--Streamline-Ultimate.png"
                alt="+"
                id="AddUpdateClick"
                onclick="CreateToDoItems();"
            />
        </div>
        
        <h5 id="Alert"></h5>
        <ul id="list-items" class="list-items"></ul>
        <!-- <h1>Todo List</h1>
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Add a new task..." required>
            <button type="submit">Add</button>
        </form>
        <ul id="todo-list"></ul> -->
    </div>

    <script src="todolist.js"></script>
    
</body>
</html>
